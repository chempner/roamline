name: Roamline
options:
  bundleIdPrefix: ch.chempner
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Roamline:
    type: application
    platform: iOS
    sources:
      - path: Roamline
    info:
      path: Roamline/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.chempner.roamline
        PRODUCT_NAME: Roamline
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Roamline
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Roamline/Roamline.entitlements
      properties: {}
    scheme:
      testTargets: []
